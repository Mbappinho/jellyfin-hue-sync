name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      # Commit pins verified against the corresponding upstream version tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build hash-locked transport and exercise Java/CLI tests
        run: python transport/build.py --test --label ci-linux
      - name: Verify distribution and licenses
        run: python transport/verify_dist.py
      - name: Validate rendered units with the real systemd parser
        run: |
          command -v systemd-analyze
          systemd-analyze --version
          python -m unittest discover -s tests -p test_deployment.py -k SystemdParserTests -v
      - name: Python suite including Node UI tests and staged packaging
        run: python -m unittest discover -s tests -v
      - name: Offline rebuild and integrity verification
        run: |
          python transport/build.py --offline --dist build/offline-transport
          python transport/verify_dist.py --dist build/offline-transport
          diff transport-dist/SHA256SUMS build/offline-transport/SHA256SUMS

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build transport prerequisite (no physical bridge)
        run: python transport/build.py --test --label ci-windows
      - name: Verify distribution
        run: python transport/verify_dist.py
      - name: Python and Node UI tests (host install remains Linux-only)
        run: python -m unittest discover -s tests -v
